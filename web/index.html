<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#474d52"><title>EFB v2 LAN</title><link rel="stylesheet" href="/client.css"><link rel="stylesheet" href="/lan-controls.css"></head>
<body>
<div id="standalone-top-background" aria-hidden="true"></div>
<form id="pair" hidden><h1>连接你的 EFB</h1><p>输入安装器显示的 4 位数字配对码。模拟器内需要已载入 PMDG 飞机并打开平板。</p><label>配对码 <input id="key" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="current-password" required></label><button>连接</button><p id="pair-error"></p></form>
<main id="viewport"><div id="surface"><iframe id="screen" title="PMDG EFB" sandbox="allow-same-origin allow-scripts allow-forms"></iframe></div><div id="offline"><p id="status" role="status">等待模拟器内的 EFB…</p><div id="lan-controls" data-lan-controls><span id="lan-aircraft" aria-label="当前机型">—</span><button id="side" type="button" role="switch" aria-checked="false" aria-label="副驾驶平板" value="CA" title="切换机长 / 副驾驶平板"><span class="lan-side-ca">CA</span><span class="lan-side-track" aria-hidden="true"><span class="lan-side-thumb"></span></span><span class="lan-side-fo">FO</span></button><button id="reconnect" type="button" title="Re-sync · 重新同步 EFB" aria-label="重新同步 EFB"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5M19 11a7 7 0 0 0-12-4L4 10m16 4-3 3A7 7 0 0 1 5 13"/></svg></button></div></div></main><script src="/client.js"></script></body></html>
